services:
  server:
    build: .
    container_name: drf_server

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - system

  redis:
    image: redis:7-alpine
    container_name: redis_server

    ports:
      - "6379:6379"

    networks:
      - system

networks:
  system: