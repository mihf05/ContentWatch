services:
  cwserever:
    build: .
    container_name: cwserver
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - cwredis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - system

  cwredis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - system

  cwdb:
    image: postgres:15 
    container_name: cwpgdb
    restart: always
    environment:
      POSTGRES_DB: cwdb
      POSTGRES_USER: cwadmin
      POSTGRES_PASSWORD: cw123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - system

networks:
  system:

volumes:
  postgres_data: